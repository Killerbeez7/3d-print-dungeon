name: Preview deploy

# Builds every claude/* branch and, when the service account secret is set,
# deploys it to its own Firebase Hosting preview channel. The live site
# (printdungeon.com) is never touched by this workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT     service account JSON with the Firebase Hosting Admin role
#   VITE_STRIPE_PUBLISHABLE_KEY  optional, Stripe publishable key (pk_...)
#
# The Firebase web config is not a secret (it ships in every page). It is read
# from the project's own Hosting site, so previews use the same keys as live.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write Firebase web config
        run: |
          curl -fsS --retry 3 https://print-dungeon-3d.web.app/__/firebase/init.json \
            | jq 'with_entries(select(.value != ""))' > src/keys/firebase_key.json
          jq -e '.apiKey and .projectId == "print-dungeon-3d"' src/keys/firebase_key.json > /dev/null

      # Fail here rather than ship a preview where nobody can sign in.
      - name: Check the Firebase API key
        run: |
          key=$(jq -r .apiKey src/keys/firebase_key.json)
          status=$(curl -sS -o "$RUNNER_TEMP/auth-config.json" -w '%{http_code}' \
            -H 'Referer: https://print-dungeon-3d.web.app/' \
            "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=$key")
          if [ "$status" != "200" ]; then
            echo "::error::Firebase rejected the web API key (HTTP $status): $(jq -r '.error.message // empty' "$RUNNER_TEMP/auth-config.json")"
            exit 1
          fi

      - run: npm run type-check

      - run: npm run build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Channel name from branch
        id: channel
        run: |
          name=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-*$//' | cut -c1-36)
          echo "id=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy to preview channel
        id: deploy
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: print-dungeon-3d
          channelId: ${{ steps.channel.outputs.id }}
          expires: 30d

      - name: Preview link
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Preview: ${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy skipped
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: |
          echo "Build passed. Preview not deployed - missing repository secret FIREBASE_SERVICE_ACCOUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Missing secret FIREBASE_SERVICE_ACCOUNT"
