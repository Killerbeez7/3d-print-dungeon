<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="3D Print Dungeon: Discover, share, and purchase 3D printable dungeon models, miniatures, and resources for tabletop gaming. Join our community of creators and enthusiasts!"
    />

    <meta name="theme-color" content="#0f1115" />

    <title>3D Print Dungeon</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Michroma&display=swap"
      rel="stylesheet"
    />

    <!-- Firestore -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- Initial LCP image -->
    <link
      rel="preload"
      href="/assets/carousel-images/MiniaturesCompetition_270.webp"
      as="image"
      fetchpriority="high"
    />

    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("theme") || "dark"
        );
      } catch {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
