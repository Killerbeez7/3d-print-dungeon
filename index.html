<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="3D Print Dungeon: Discover, share, and purchase 3D printable dungeon models, miniatures, and resources for tabletop gaming. Join our community of creators and enthusiasts!"
    />

    <meta name="theme-color" content="#0f0f12" />

    <title>3D Print Dungeon</title>

    <!-- Firestore -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- Initial LCP image -->
    <link
      rel="preload"
      href="/assets/images/hero-miniatures.webp"
      as="image"
      fetchpriority="high"
    />

    <script>
      try {
        var theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#ffffff" : "#0f0f12");
      } catch {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
