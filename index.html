<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="3D Print Dungeon: Discover, share, and purchase 3D printable dungeon models, miniatures, and resources for tabletop gaming. Join our community of creators and enthusiasts!"
    />

    <meta name="theme-color" content="#0f0f12" />

    <!-- Tab and home-screen icons (versioned names: /assets is cached for a year) -->
    <link rel="icon" href="/assets/icons/pd-die-v4.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/icons/pd-die-v4-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/icons/pd-die-v7-apple-180.png" />

    <title>3D Print Dungeon</title>

    <!-- Firestore -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- Model images (plain <img> requests, so no crossorigin) -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />

    <!-- Initial LCP image -->
    <link
      rel="preload"
      href="/assets/images/hero-miniatures.webp"
      as="image"
      fetchpriority="high"
    />

    <!-- Page colour before the stylesheet arrives, so reloads don't flash white (tokens: --bg-page). -->
    <style>
      html { background: #0a0a0c; color-scheme: dark; }
      html[data-theme="light"] { background: #f6f6f7; color-scheme: light; }
    </style>

    <script>
      try {
        var theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#ffffff" : "#0f0f12");
      } catch {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
